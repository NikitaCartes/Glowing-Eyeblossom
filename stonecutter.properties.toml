mod_id = "glowing-eyeblossom"
mod_name = "Glowing Eyeblossom"
mod_version = "1.4.0"

# Bundled Hocon config libraries (Loom `include` on Fabric, shaded+relocated on NeoForge)
hocon_version = "4.1.2"
commons_text_version = "1.10.0"
typesafe_config_version = "1.4.3"
geantyref_version = "1.3.13"
mixinextras_version = "0.5.4"

# Fabric — loader versions: https://fabricmc.net/develop/
# Minecraft is shipped deobfuscated from 26.1 on. Older nodes add Mojang mappings and
# publish the remapped jar, see build.fabric-obf.gradle.kts.
[fabric."1.21.4"]
minecraft_version = "1.21.4"
loader_version = "0.19.3"
java_version = "21"
supported_minecraft_version = ">=1.21.4- <26.1"
display_name = "[1.21.4 - 1.21.11]"
supported_versions = "1.21.4,1.21.5,1.21.6,1.21.7,1.21.8,1.21.9,1.21.10,1.21.11"

[fabric."26.1"]
minecraft_version = "26.1"
loader_version = "0.19.3"
java_version = "25"
supported_minecraft_version = ">=26.1- <26.2"
display_name = "[26.1]"
supported_versions = "26.1,26.1.1,26.1.2"

[fabric."26.2"]
minecraft_version = "26.2"
loader_version = "0.19.3"
java_version = "25"
supported_minecraft_version = ">=26.2-"
display_name = "[26.2+]"
supported_versions = "26.2"

# NeoForge — versions: https://projects.neoforged.net/neoforged/neoforge
# neoforge_version is the oldest supported build of the range: neoforge.mods.toml turns it
# into the open-ended dependency range "[<neoforge_version>,)".
[neoforge."1.21.4"]
minecraft_version = "1.21.4"
neoforge_version = "21.4.157"
java_version = "21"
supported_minecraft_version = "[1.21.4,26.1)"
display_name = "[1.21.4 - 1.21.11]"
supported_versions = "1.21.4,1.21.5,1.21.6,1.21.7,1.21.8,1.21.9,1.21.10,1.21.11"

[neoforge."26.1"]
minecraft_version = "26.1"
neoforge_version = "26.1.2.94"
java_version = "25"
supported_minecraft_version = "[26.1,26.2)"
display_name = "[26.1]"
supported_versions = "26.1,26.1.1,26.1.2"

[neoforge."26.2"]
minecraft_version = "26.2"
neoforge_version = "26.2.0.7-beta"
java_version = "25"
supported_minecraft_version = "[26.2,)"
display_name = "[26.2+]"
supported_versions = "26.2"
